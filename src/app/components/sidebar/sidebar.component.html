<!-- Botón toggle para móviles -->
<button class="sidebar-toggle" (click)="toggleSidebar()">
  <i class="fa-solid fa-bars"></i>
</button>

<!-- Overlay para cerrar sidebar en móviles -->
<div class="sidebar-overlay" [class.active]="sidebarActive" (click)="closeSidebar()"></div>

<!-- Sidebar -->
<div class="sidebar-custom" [class.active]="sidebarActive">
  <!-- Header del sidebar con información de usuario -->
  <div class="sidebar-user">
    <h4>Cars Accessories</h4>
    <p>Panel de Administración</p>
  </div>

  <!-- Navegación -->
  <nav>
    <ul class="navbar-nav flex-column w-100">
      <li class="nav-item">
        <a class="nav-link" routerLink="/dashboard" routerLinkActive="active" (click)="closeSidebar()">
          <i class="fa-solid fa-house"></i>
          Dashboard
        </a>
      </li>
      
      <li class="nav-item">
        <a class="nav-link" routerLink="/cotizaciones" routerLinkActive="active" (click)="closeSidebar()">
          <i class="fa-solid fa-file-invoice"></i>
          Cotizaciones
        </a>
      </li>
      
      <li class="nav-item">
        <a class="nav-link" routerLink="/productos" routerLinkActive="active" (click)="closeSidebar()">
          <i class="fa-solid fa-toolbox"></i>
          Productos
        </a>
      </li>
      
      <li class="nav-item" *ngIf="role === 'ROLE_ADMIN'">
        <a class="nav-link" routerLink="/categorias" routerLinkActive="active" (click)="closeSidebar()">
          <i class="fa-solid fa-tags"></i>
          Categorías
        </a>
      </li>
      
      <li class="nav-item" *ngIf="role === 'ROLE_ADMIN'">
        <a class="nav-link" routerLink="/suppliers" routerLinkActive="active" (click)="closeSidebar()">
          <i class="fa-solid fa-truck"></i>
          Proveedores
        </a>
      </li>
      
      <li class="nav-item">
        <a class="nav-link" routerLink="/vehiculos" routerLinkActive="active" (click)="closeSidebar()">
          <i class="fa-solid fa-car"></i>
          Vehículos
        </a>
      </li>
      
      <li class="nav-item">
        <a class="nav-link" routerLink="/clientes" routerLinkActive="active" (click)="closeSidebar()">
          <i class="fa-solid fa-user"></i>
          Clientes
        </a>
      </li>
      
      <li class="nav-item" *ngIf="role === 'ROLE_ADMIN'">
        <a class="nav-link" routerLink="/register" routerLinkActive="active" (click)="closeSidebar()">
          <i class="fa-solid fa-user-plus"></i>
          Registrar Usuario
        </a>
      </li>
      
      <li class="nav-item">
        <a class="nav-link" (click)="logout()" style="cursor: pointer;">
          <i class="fa-solid fa-right-from-bracket"></i>
          Cerrar Sesión
        </a>
      </li>
    </ul>
  </nav>
</div>
