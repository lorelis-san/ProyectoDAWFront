<div class="main-content container-fluid mt-4">
  <div class="text-center mb-4">
    <h2 class="section-title">Gestión de Proveedores</h2>
  </div>
  <div class="search-container mb-4">
    <div class="search-wrapper">

      <input type="text" class="form-control search-input" placeholder="Buscar por RUC o razón social..."
        [(ngModel)]="searchTerm" (ngModelChange)="onSearch()" />


    </div>
    <div class="d-flex justify-content-end mb-3">
      <button class="btn btn-add-category" (click)="openModal()">+ Nuevo Proveedor</button>
    </div>
  </div>


  <div class="suppliers-grid">
    <div class="supplier-card" *ngFor="let supplier of suppliers">
      <div class="supplier-header">
        <div class="supplier-title">
          <h3 class="supplier-name">{{ supplier.name }}</h3>
          <p class="supplier-code">RUC: {{ supplier.ruc }}</p>
        </div>
        <div class="supplier-actions">
          <button class="btn-icon btn-icon-edit" (click)="openModal(supplier)" title="Editar">
            <i class="fa-solid fa-pen-to-square"></i>
          </button>
          <button class="btn-icon btn-icon-delete" (click)="deleteSupplier(supplier.id!)" title="Eliminar">
            <i class="fa-solid fa-trash"></i>
          </button>
        </div>
      </div>

      <div class="supplier-info">
        <div class="info-row">
          <i class="fa-solid fa-user info-icon"></i>
          <span class="info-text">{{ supplier.name }}</span>
        </div>
        <div class="info-row">
          <i class="fa-solid fa-phone info-icon"></i>
          <span class="info-text">{{ supplier.phone }}</span>
        </div>
        <div class="info-row" *ngIf="supplier.email">
          <i class="fa-solid fa-envelope info-icon"></i>
          <span class="info-text">{{ supplier.email }}</span>
        </div>
      </div>
    </div>
  </div>

  <!-- Modal -->
  <div class="modal fade" id="supplierModal" tabindex="-1" aria-labelledby="supplierModalLabel" aria-hidden="true">
    <div class="modal-dialog modal-lg modal-dialog-centered">
      <div class="modal-content category-modal">
        <div class="modal-header border-0">
          <h5 class="modal-title" id="supplierModalLabel">
            {{ isEditMode ? 'Editar Proveedor' : 'Nuevo Proveedor' }}
          </h5>
          <button type="button" class="btn-close btn-close-white" data-bs-dismiss="modal" aria-label="Cerrar"></button>
        </div>

        <form (ngSubmit)="save()" #supplierForm="ngForm">
          <div class="modal-body">
            <div class="row">
              <div class="col-md-6 mb-3">
                <label class="form-label">Nombre <span class="text-danger">*</span></label>
                <input type="text" class="form-control category-input" [(ngModel)]="supplier.name" name="name" required
                  placeholder="Nombre del proveedor" />
              </div>

              <div class="col-md-6 mb-3">
                <label class="form-label">RUC <span class="text-danger">*</span></label>
                <input type="text" class="form-control category-input" [(ngModel)]="supplier.ruc" name="ruc" required
                  maxlength="11" (keypress)="onlyNumbers($event)" placeholder="20123456789" />
              </div>
            </div>

            <div class="row">
              <div class="col-md-6 mb-3">
                <label class="form-label">Teléfono <span class="text-danger">*</span></label>
                <input type="tel" class="form-control category-input" [(ngModel)]="supplier.phone" name="phone" required
                  maxlength="9" (keypress)="onlyNumbers($event)" placeholder="987654321" />
              </div>

              <div class="col-md-6 mb-3">
                <label class="form-label">Email</label>
                <input type="email" class="form-control category-input" [(ngModel)]="supplier.email" name="email"
                  placeholder="proveedor@ejemplo.com" />
              </div>
            </div>
          </div>

          <div class="modal-footer border-0">
            <button type="submit" class="btn btn-save" [disabled]="!isFormValid()">
              {{ isEditMode ? 'Actualizar' : 'Guardar' }}
            </button>
            <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">
              Cancelar
            </button>
          </div>
        </form>
      </div>
    </div>
  </div>
